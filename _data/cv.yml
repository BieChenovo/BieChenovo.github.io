    Research Experience:
      - company: Tongji University
        position: "Undergraduate Thesis: Context-Aware DRL for Mapless Navigation with Temporal Memory and Curiosity"
        location: "Independent Researcher · Advisor: Prof. Chao Huang"
        start_date: 2025-12
        end_date: 2026-06
        highlights:
          - Built upon CoRL 2023's GAT-based encoder-decoder framework with a pointer network for viewpoint graph navigation; identified its limitations under partial observability and sparse rewards in unknown environments.
          - Introduced GraphLSTM to capture temporal dependencies across graph states, enabling the agent to maintain episodic memory under partial observability and improve long-horizon planning consistency.
          - Extended SAC with an Intrinsic Curiosity Module (ICM), using forward-dynamics prediction error as intrinsic reward to drive exploration and mitigate slow convergence under sparse rewards.
          - Ablations across Maze/Corridor/Office/Dynamic environments in ROS/Gazebo; the full model (GAT+LSTM+ICM) reached 0.84 average Success Rate and 0.66 SPL, beating the CoRL 2023 baseline and all single-module variants.

      - company: Tongji University
        position: Autonomous Navigation System for Hexapod Robots
        location: "Core Developer, Perception & Planning Lead · Advisor: Dr. Jia Xu"
        start_date: 2024-05
        end_date: 2025-09
        highlights:
          - Deployed and calibrated a real-time visual SLAM system (ORB-SLAM3) on a physical hexapod robot via ROS, overcoming sensor noise, IMU drift, and unmodeled leg-ground contact dynamics that are absent in simulation.
          - Co-developed a hierarchical navigation stack, with a local path planner bridging high-level SLAM-based global pose estimation and low-level legged locomotion control, achieving closed-loop perception-to-action on real hardware.
          - Performed end-to-end hardware-software integration and debugging of the full autonomy pipeline (perception, planning, control), achieving collision-free navigation and reliable pose tracking indoors.

      - company: Tongji University
        position: Electric Bus Fleet Dispatch with Wireless Charging
        location: "Team Leader (3 members) · Advisor: Dr. Jia Xu"
        start_date: 2024-08
        end_date: 2024-11
        highlights:
          - Designed a Transformer-enhanced DRL framework to solve large-scale electric bus fleet dispatch, jointly optimizing multi-vehicle routing and charging schedules under dynamic electricity pricing and time-varying passenger demand.
          - Used a Transformer as the policy backbone, with self-attention encoding high-dimensional sequential states (demand and multi-vehicle status) to capture long-range temporal dependencies that MLP policies struggle to model.
          - Won 2nd prize among ~100 teams, outperforming heuristic dispatch baselines on energy and time cost.

